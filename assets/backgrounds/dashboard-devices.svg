<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BDEEFF"/><stop offset=".45" stop-color="#4C91C2"/><stop offset="1" stop-color="#233C70"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7AE8FF"/><stop offset="1" stop-color="#5E63C8"/></linearGradient>
 <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9BEAFF"/><stop offset="1" stop-color="#455B9C"/></linearGradient>
</defs>
<!-- floating laptop -->
<g opacity=".86" transform="translate(115 115) rotate(-13 110 80)">
